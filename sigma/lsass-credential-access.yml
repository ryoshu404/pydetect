title: LSASS Credential Access
id: 856d1159-3651-45b4-8e67-87e9b4d396d4
status: experimental
description: Detects suspicious process access to lsass.exe with high-privilege access masks associated with credential dumping tools including Mimikatz, ProcDump, and comsvcs.dll-based memory dumping. High FP rate expected — tuning is required in production deployment.
author: ryoshu404
date: 2026-05-13
references:
    - https://attack.mitre.org/detectionstrategies/DET0363/
    - https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
    - https://github.com/mitre-attack/car/issues/10
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143A'
            - '0x1F0FFF'
    condition: selection
falsepositives:
    - Antivirus and EDR products
    - Security and performance monitoring tools
    - Legitimate Windows system processes
    - High FP rate, tuning required in production (see decision doc for variants)
level: medium
